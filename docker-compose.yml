services:
  price-tracker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/prices.db
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"   # /health
    shm_size: "512mb" # Chrome needs more shared memory than Docker's 64 MB default

# Add products:   docker compose run --rm price-tracker import examples/products.example.json
# Run one check:  docker compose run --rm price-tracker check
# Report:         docker compose run --rm price-tracker report --out data/report
